<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin – Quiz Manager</title>
    <link href="./css/base.css" rel="stylesheet"/>
    <link href="./css/forms.css" rel="stylesheet"/>
    <link href="./css/buttons.css" rel="stylesheet"/>
    <link href="./css/admin.css" rel="stylesheet"/>
    <link href="./css/quiz.css" rel="stylesheet"/>
    <link href="./css/badges.css" rel="stylesheet"/>
    <link href="./css/errors.css" rel="stylesheet"/>
    <link href="./css/responsive.css" rel="stylesheet"/>
</head>
<body>
<header>
    <h1>Admin Dashboard</h1>
    <button id="logout-btn">Logout</button>
</header>

<main>
    <section id="quiz-creator">
        <h2>Create New Quiz</h2>
        <form id="quiz-form" novalidate>
            <input id="quiz-title" placeholder="Quiz Title" required type="text"/>
            <textarea id="quiz-description" placeholder="Quiz Description" required></textarea>

            <div id="question-list"></div>
            <button id="add-question-btn" type="button">+ Add Question</button>
            <br/><br/>

            <label>Assign To:</label>
            <select id="assign-mode">
                <option value="all">All Users</option>
                <option value="custom">Selected Users</option>
            </select>

            <!-- 🔽 This div is shown only when 'custom' is selected -->
            <div class="hidden" id="user-checkboxes"></div>

            <button type="submit">Save Quiz</button>
        </form>
    </section>

    <section id="quiz-list">
        <h2>My Quizzes</h2>
        <ul id="admin-quiz-list"></ul>
    </section>
</main>

<script src="./js/admin.js" type="module"></script>
</body>
</html>
