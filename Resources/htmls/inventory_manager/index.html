<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inventory Manager – TypeScript Sandbox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Inventory Manager</h1>

    <section class="product-form">
      <h2>Add New Product</h2>
      <form id="add-product-form" novalidate>
        <label class="required">
          Product Name
          <input type="text" id="product-name" required />
          <span class="error-message" id="error-name"></span>
        </label>

        <label class="required">
          Category
          <select id="product-category" required>
            <option value="">Select...</option>
            <option value="Electronics">Electronics</option>
            <option value="Books">Books</option>
            <option value="Clothing">Clothing</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-message" id="error-category"></span>
        </label>

        <label class="required">
          Quantity
          <input type="number" id="product-quantity" min="1" required />
          <span class="error-message" id="error-quantity"></span>
        </label>

        <label class="required">
          Status
          <select id="product-status" required>
            <option value="">Select...</option>
            <option value="Available">Available</option>
            <option value="OutOfStock">OutOfStock</option>
            <option value="Discontinued">Discontinued</option>
          </select>
          <span class="error-message" id="error-status"></span>
        </label>

        <button type="submit">Add Product</button>
      </form>
    </section>

    <section class="inventory-table">
      <h2>Current Inventory</h2>
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Product rows will be added here dynamically -->
        </tbody>
      </table>
    </section>

    <script src="script.js"></script>
  </body>
</html>
