<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inventory Manager – TypeScript Sandbox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --primary: #2b6777;
        --accent: #c8d8e4;
        --bg-light: #f2f2f2;
        --white: #ffffff;
        --text-dark: #1a1a1a;
        --radius: 8px;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-color: var(--bg-light);
        margin: 0;
        padding: 2rem;
        color: var(--text-dark);
      }

      h1,
      h2 {
        text-align: center;
        color: var(--primary);
      }

      section {
        background: var(--white);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin: 1.5rem auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        max-width: 900px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }

      label {
        display: flex;
        flex-direction: column;
        font-weight: 500;
      }

      input,
      select {
        padding: 0.6rem;
        margin-top: 0.3rem;
        border: 1px solid #ccc;
        border-radius: var(--radius);
      }

      button {
        grid-column: 1 / -1;
        padding: 0.75rem;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
      }

      button:hover {
        background-color: #406882;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th,
      td {
        padding: 0.8rem;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background-color: var(--accent);
      }

      .required::after {
        content: " *";
        color: red;
      }

      .error-message {
        color: red;
        font-size: 0.85rem;
        margin-top: 0.2rem;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <h1>Inventory Manager</h1>

    <section class="product-form">
      <h2>Add New Product</h2>
      <form id="add-product-form" novalidate>
        <label class="required">
          Product Name
          <input type="text" id="product-name" required />
          <span class="error-message" id="error-name"></span>
        </label>

        <label class="required">
          Category
          <select id="product-category" required>
            <option value="">Select...</option>
            <option value="Electronics">Electronics</option>
            <option value="Books">Books</option>
            <option value="Clothing">Clothing</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-message" id="error-category"></span>
        </label>

        <label class="required">
          Quantity
          <input type="number" id="product-quantity" min="1" required />
          <span class="error-message" id="error-quantity"></span>
        </label>

        <label class="required">
          Status
          <select id="product-status" required>
            <option value="">Select...</option>
            <option value="Available">Available</option>
            <option value="OutOfStock">OutOfStock</option>
            <option value="Discontinued">Discontinued</option>
          </select>
          <span class="error-message" id="error-status"></span>
        </label>

        <button type="submit">Add Product</button>
      </form>
    </section>

    <section class="inventory-table">
      <h2>Current Inventory</h2>
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Product rows will be added here dynamically -->
        </tbody>
      </table>
    </section>

    <script>
      const form = document.getElementById("add-product-form");
      const nameInput = document.getElementById("product-name");
      const categorySelect = document.getElementById("product-category");
      const quantityInput = document.getElementById("product-quantity");
      const statusSelect = document.getElementById("product-status");

      const errorName = document.getElementById("error-name");
      const errorCategory = document.getElementById("error-category");
      const errorQuantity = document.getElementById("error-quantity");
      const errorStatus = document.getElementById("error-status");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearErrors();

        const name = nameInput.value.trim();
        const category = categorySelect.value;
        const quantity = parseInt(quantityInput.value, 10);
        const status = statusSelect.value;

        let hasError = false;

        if (!name) {
          errorName.textContent = "Product name is required.";
          hasError = true;
        }

        if (!category) {
          errorCategory.textContent = "Please select a category.";
          hasError = true;
        }

        if (!quantityInput.value || isNaN(quantity) || quantity < 1) {
          errorQuantity.textContent = "Quantity must be at least 1.";
          hasError = true;
        }

        if (!status) {
          errorStatus.textContent = "Please select a status.";
          hasError = true;
        }

        if (hasError) return;

        const tableBody = document.querySelector("#inventory-table tbody");
        const row = document.createElement("tr");

        row.innerHTML = `
      <td>${name}</td>
      <td>${category}</td>
      <td>${quantity}</td>
      <td>${status}</td>
    `;

        tableBody.appendChild(row);
        form.reset();
      });

      function clearErrors() {
        errorName.textContent = "";
        errorCategory.textContent = "";
        errorQuantity.textContent = "";
        errorStatus.textContent = "";
      }
    </script>
  </body>
</html>
