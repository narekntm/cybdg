<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Management – Cypress Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Modular CSS imports -->
  <link rel="stylesheet" href="./css_modules/variables.css" />
  <link rel="stylesheet" href="./css_modules/reset-global.css" />
  <link rel="stylesheet" href="./css_modules/typography.css" />
  <link rel="stylesheet" href="./css_modules/layout.css" />
  <link rel="stylesheet" href="./css_modules/forms.css" />
  <link rel="stylesheet" href="./css_modules/buttons.css" />
  <link rel="stylesheet" href="./css_modules/tables.css" />
  <link rel="stylesheet" href="./css_modules/errors.css" />
  <link rel="stylesheet" href="./css_modules/modals.css" />
  <link rel="stylesheet" href="./css_modules/responsive.css" />
</head>

<body>
<div class="app-wrapper">
  <header class="app-header">
    <h1>User Management – Cypress Sandbox</h1>
  </header>

  <main class="grid-layout">

    <!-- Admin Login Card -->
    <section class="card">
      <h2>Login as Admin</h2>
      <div id="admin-controls" class="inline-message" style="display: none;">
        <strong>You are logged in as admin.</strong>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </div>
      <form id="admin-login-form" novalidate>
        <div>
          <label for="admin-email">Email</label>
          <input id="admin-email" required type="email" />
        </div>
        <div>
          <label for="admin-password">Password</label>
          <input id="admin-password" required type="password" />
        </div>
        <div class="full-width">
          <button type="submit" class="btn-primary full-width">Login</button>
        </div>
        <div id="login-status" class="error-text" style="display: none;">Invalid credentials</div>
      </form>
    </section>

    <!-- User Form Card -->
    <section class="card">
      <h2 id="form-title">Add New User</h2>
      <form id="user-form" class="form-grid">
        <div>
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" />
        </div>

        <div>
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="">Select</option>
            <option>Admin</option>
            <option>Viewer</option>
            <option>Editor</option>
          </select>
        </div>

        <div>
          <label for="age">Age</label>
          <input id="age" name="age" type="number" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>

        <div class="field-group full-width">
          <label>Gender</label>
          <div class="inline-options">
            <label><input type="radio" name="gender" value="Male" /> Male</label>
            <label><input type="radio" name="gender" value="Female" /> Female</label>
            <label><input type="radio" name="gender" value="Other" /> Other</label>
          </div>
        </div>

        <div class="field-group full-width">
          <label>Subscribe to</label>
          <div class="inline-options">
            <label><input type="checkbox" name="subscribe" value="Newsletter" /> Newsletter</label>
            <label><input type="checkbox" name="subscribe" value="Product Updates" /> Product Updates</label>
          </div>
        </div>

        <div class="full-width">
          <button type="submit" class="btn-primary full-width">Save</button>
        </div>
      </form>

    </section>

    <!-- User Table Card -->
    <section class="card">
      <h2>User Table</h2>
      <div id="admin-delete-error" class="error-text" style="display: none;"></div>
      <input id="search-input" type="text" placeholder="Search by Name, Email or Role" class="full-width" />

      <table id="user-table">
        <thead>
        <tr>
          <th>Name</th><th>Role</th><th>Age</th><th>Email</th><th>Gender</th><th>Subscription</th><th>Status</th><th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="pagination-controls" class="pagination-bar">
        <button id="prev-page" class="btn-primary">Previous</button>
        <span id="page-info">Page 1 of 1</span>
        <button id="next-page" class="btn-primary">Next</button>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <div class="modal" id="confirm-delete-modal">
    <div class="modal-content">
      <p>Are you sure you want to delete this user?</p>
      <button id="confirm-delete" class="btn-danger">Yes</button>
      <button id="cancel-delete" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <div class="modal" id="confirm-reset-modal">
    <div class="modal-content">
      <p>Reset all data back to original three users?</p>
      <button id="confirm-reset" class="btn-danger">Yes, Reset</button>
      <button id="cancel-reset" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <button id="reset-btn" class="btn-secondary">Reset Data</button>
    <p>&copy; 2025 Cypress Sandbox</p>
  </footer>
</div>

<!-- Main script -->
<script type="module" src="./main.js"></script>
</body>
</html>
